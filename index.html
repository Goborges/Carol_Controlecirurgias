<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Cirurgias</title>
<meta name="description" content="Registro pessoal de cirurgias e valores a receber. Os dados ficam só neste aparelho.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cirurgias">
<meta name="format-detection" content="telephone=no">

<meta name="theme-color" content="#0d1413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de bolso — barra fixa no topo, conteúdo em coluna única, abas embaixo; datas como etiquetas térmicas de hospital. */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --surface-2: #e4ebe8;
  --ink: #142220;
  --muted: #5a6b67;
  --line: #d3ddd9;
  --accent: #0b6b66;
  --accent-ink: #ffffff;
  --accent-soft: #d5ebe7;
  --ok: #1c7445;
  --ok-soft: #dcefe3;
  --warn: #9a5a06;
  --warn-soft: #f6e8cf;
  --danger: #b0261f;
  --danger-soft: #f7dedb;
  --night: #47499c;
  --night-soft: #e3e3f6;
  --label: #fbfcf8;
  --on-danger: #ffffff;
  --shadow: 0 1px 2px rgba(20, 34, 32, .06), 0 6px 18px rgba(20, 34, 32, .06);
  --font-ui: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  --tabbar-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1413; --surface: #151f1e; --surface-2: #1d2a28; --ink: #e4eeeb; --muted: #94a7a2; --line: #2a3a37;
    --accent: #52b9ae; --accent-ink: #052220; --accent-soft: #15403c;
    --ok: #6cc996; --ok-soft: #173826; --warn: #e7ab52; --warn-soft: #3d2c12; --danger: #f08a80; --danger-soft: #45201d;
    --night: #a7a9f4; --night-soft: #262848; --label: #1a2422; --on-danger: #2a0d0b; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1413; --surface: #151f1e; --surface-2: #1d2a28; --ink: #e4eeeb; --muted: #94a7a2; --line: #2a3a37;
  --accent: #52b9ae; --accent-ink: #052220; --accent-soft: #15403c;
  --ok: #6cc996; --ok-soft: #173826; --warn: #e7ab52; --warn-soft: #3d2c12; --danger: #f08a80; --danger-soft: #45201d;
  --night: #a7a9f4; --night-soft: #262848; --label: #1a2422; --on-danger: #2a0d0b; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
html.sheet-open body { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; }

/* barra do topo */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 56px; }
.topbar h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; flex: 1; min-width: 0; }
.topbar .sub { display: block; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-top: 4px; }

/* abas */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 11px; font-weight: 600; color: var(--muted); border-radius: 10px; min-height: 46px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab .ic { width: 24px; height: 24px; }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 12px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; min-height: 46px; text-align: center; line-height: 1.2; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.sm { min-height: 38px; padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { border: 0; background: none; width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 12px; color: var(--ink); flex: none; }
.icon-btn-ph { width: 44px; height: 44px; flex: none; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions .btn.primary { grid-column: 1 / -1; }

/* cartões e seções */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section-title { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section-title button { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: 0; text-transform: none; padding: 4px 0; }

/* destaque: a receber */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.hero .label { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hero .big { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: clamp(30px, 9vw, 40px); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.hero .big small { font-size: .5em; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-right: 4px; }
.aging { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.aging span { display: block; height: 100%; }
.aging-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 12px; }
.aging-legend div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.aging-legend b { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 1px; }
.a0 { background: var(--accent); } .a1 { background: color-mix(in srgb, var(--accent) 55%, var(--warn)); } .a2 { background: var(--warn); } .a3 { background: var(--danger); }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .k { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 21px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.stat .s { font-size: 13px; color: var(--muted); }

/* avisos que pedem ação */
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; }
.alert .ic { color: var(--muted); }
.alert .t { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; }
.alert .t span { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.alert.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); background: var(--warn-soft); }
.alert.warn .ic { color: var(--warn); }
.alert.danger { border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); background: var(--danger-soft); }
.alert.danger .ic { color: var(--danger); }
.alert.info .ic { color: var(--accent); }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }
.banner .ic { color: var(--accent); margin-top: 1px; }
.banner b { display: block; font-size: 15px; }
.banner button { margin-top: 6px; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px; }

/* lista de cirurgias */
.month-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 2px 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.month-head .num { text-transform: none; letter-spacing: 0; font-weight: 500; }
.rlist { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ritem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.ritem:first-child { border-top: 0; }
.ritem.sel { background: var(--accent-soft); }
.tagdate { font-family: var(--font-mono); font-variant-numeric: tabular-nums; background: var(--label); border: 1px dashed var(--line); border-radius: 6px; padding: 5px 6px; width: 62px; text-align: center; line-height: 1.15; display: flex; flex-direction: column; align-items: center; }
.tagdate .wd { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tagdate .d { font-size: 15px; font-weight: 600; }
.tagdate .h { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; }
.tagdate .h .ic { width: 11px; height: 11px; color: var(--night); stroke-width: 2.2; }
.rmain { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rmain .p { font-weight: 600; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rmain .m { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 8px; align-items: center; }
.rmain .m .ic { width: 13px; height: 13px; }
.rside { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
.rside .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; white-space: nowrap; }
.rside .val.est { color: var(--muted); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 3px 8px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.night { background: var(--night-soft); color: var(--night); }
.pill.wrap { white-space: normal; border-radius: 10px; padding: 6px 10px; line-height: 1.35; font-weight: 600; font-size: 12px; align-items: flex-start; }
.pill.wrap .ic { margin-top: 1px; }
.refs { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.refs > div { display: flex; flex-direction: column; gap: 2px; padding: 11px 14px; border-top: 1px solid var(--line); }
.refs > div:first-child { border-top: 0; }
.refs b { font-weight: 600; font-size: 15px; }
.refs span { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* busca e filtros */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; min-height: 46px; }
.search input[type="search"] { border: 0; outline: 0; background: none; flex: 1; min-width: 0; font-size: 16px; padding: 10px 0; min-height: 0; border-radius: 0; -webkit-appearance: none; appearance: none; }
.search .ic { color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -2px; padding-inline: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 99px; font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .n { font-family: var(--font-mono); font-weight: 500; opacity: .75; margin-left: 4px; }
.filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.filters select { width: 100%; }
.selbar { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 4; display: flex; gap: 8px; align-items: center; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 8px 8px 14px; font-size: 14px; font-weight: 600; }
.selbar span { flex: 1; }
.selbar .btn { min-height: 36px; padding: 6px 10px; font-size: 13px; background: var(--bg); color: var(--ink); border-color: transparent; }

/* formulários */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="date"], input[type="time"], input[type="number"], input[type="search"], input[type="password"], input:not([type]), select, textarea {
  width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 16px; min-height: 46px; color: var(--ink); }
textarea { min-height: 84px; resize: vertical; }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; text-align: left; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags:empty { display: none; }
.tag { display: inline-flex; align-items: center; gap: 2px; background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 5px 4px 5px 10px; font-size: 14px; font-weight: 600; max-width: 100%; }
.tag button { border: 0; background: none; width: 26px; height: 26px; display: grid; place-items: center; color: var(--muted); border-radius: 6px; padding: 0; }
.tag button .ic { width: 15px; height: 15px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.kv { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.caption-box { background: var(--label); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--font-mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.flags { display: flex; flex-direction: column; gap: 6px; }

/* fotos */
.photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.thumb { flex: none; width: 92px; height: 92px; border-radius: 10px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); padding: 0; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.add { display: grid; place-items: center; color: var(--accent); border-style: dashed; }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ptile { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid transparent; padding: 0; background: var(--surface-2); }
.ptile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ptile.sel { border-color: var(--accent); }
.ptile .chk { position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; border-radius: 99px; border: 2px solid #fff; background: rgba(0,0,0,.25); display: grid; place-items: center; color: #fff; }
.ptile.sel .chk { background: var(--accent); border-color: var(--accent); }
.ptile .chk .ic { width: 15px; height: 15px; stroke-width: 3; }
.ptile .zoom { position: absolute; right: 4px; bottom: 4px; width: 32px; height: 32px; border-radius: 8px; border: 0; background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; }
.ptile .zoom .ic { width: 17px; height: 17px; }
.viewer { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; color: #fff; }
.viewer-top { display: flex; justify-content: space-between; align-items: center; padding: calc(6px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); }
.viewer-top .icon-btn { color: #fff; }
.viewer-img { flex: 1; overflow: auto; display: grid; place-items: center; -webkit-overflow-scrolling: touch; }
.viewer-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer-img.zoom { place-items: start; }
.viewer-img.zoom img { max-width: none; max-height: none; width: 200%; }
.viewer-nav { display: flex; justify-content: space-between; padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.viewer-nav .icon-btn { color: #fff; }

/* folhas (telas por cima) */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; transform: translateY(100%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 -10px 30px rgba(0, 0, 0, .08); }
.sheet.open { transform: none; }
.sheet.closing { transform: translateY(100%); }
.sheet-head { display: flex; align-items: center; gap: 4px; padding: calc(4px + env(safe-area-inset-top, 0px)) max(6px, env(safe-area-inset-right, 0px)) 4px max(6px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--bg); }

        else { const t = S.terms.find((x) => x.type === 'col' && x.name === o.col); if (t && !t.aliases.includes(n)) { t.aliases.push(n); termsUpd.push(t); } }
      }
      for (const l of rep.lines) {
        if (!C.mapRepasseProc(l.proc, S.index) && !termsAdd.some((t) => t.type === 'proc' && t.aliases[0] === C.norm(l.proc))) {
          const n = C.norm(l.proc); const key = n.split(' ').find((w) => w.length > 3) || n.split(' ')[0];
          termsAdd.push({ id: C.uid('t'), type: 'proc', name: C.sentenceCase(l.proc), fam: key, aliases: [n], kw: [[key]] });
        }
        if (l.conv && !S.terms.some((t) => t.type === 'conv' && C.norm(t.name) === C.norm(l.conv)) && !termsAdd.some((t) => t.type === 'conv' && C.norm(t.name) === C.norm(l.conv))) termsAdd.push({ id: C.uid('t'), type: 'conv', name: l.conv, aliases: [C.norm(l.conv)] });
      }
      S.terms.push(...termsAdd); await Store.putMany('terms', [...termsAdd, ...termsUpd]); derive();
      const changed = []; let matched = 0, created = 0;
      for (const a of acts) {
        const lines = a.lines.map((l) => { const t = C.mapRepasseProc(l.proc, S.index); const procName = t ? t.name : C.sentenceCase(l.proc); return { date: l.date, time: l.time, valor: l.valor, conv: l.conv, cod: l.cod, proc: l.proc, procName, fam: C.famOf(S.index, procName), funcao: l.funcao, exec: l.exec, repId: rep.id }; });
        const o = st.over.get(a.exec); const col = o ? (o.col === '__novo__' ? o.novo : o.col) : null;
        const pay = { valor: a.valor, data: st.pay || today(), origem: 'repasse', repId: rep.id };
        const r = a.recordId && !st.unlink.has(a.recordId) ? S.records.find((x) => x.id === a.recordId) : null;
        if (r) {
          r.status = 'recebido'; r.recebido = pay; r.rep = lines;
          if (!r.conv) r.conv = lines[0].conv; if (!r.funcao) r.funcao = lines[0].funcao; if (!r.time && a.time) r.time = a.time;
          if (!(r.cols || []).length && col) r.cols = [col]; if (!r.procs.length) r.procs = uniq(lines.map((l) => l.procName));
          if (!r.hosp && st.hosp) r.hosp = st.hosp;
          r.revisar = (r.revisar || []).filter((f) => f !== 'Sem procedimento'); r.updatedAt = Date.now();
          changed.push(r); matched++;
        } else {
          S.settings.seq += 1;
          const nr = newRecord({ num: S.settings.seq, origem: 'repasse', date: a.date, time: a.time, procs: uniq(lines.map((l) => l.procName)), hosp: st.hosp || null, cols: col ? [col] : [], conv: lines[0].conv, funcao: lines[0].funcao, status: 'recebido', recebido: pay, rep: lines });
          S.records.push(nr); changed.push(nr); created++;
        }
      }
      await Store.putMany('records', changed);
      const doc = { id: rep.id, numero: rep.numero, comp: rep.comp, nome: rep.nome, total: rep.total, n: rep.lines.length, hosp: st.hosp || null, pay: st.pay || today(), importedAt: Date.now() };
      S.repasses.push(doc); await Store.put('repasses', doc);
      S.settings.hospRepasse = st.hosp || S.settings.hospRepasse; await saveSettings(); persistStorage();
      derive(); render();
      st.res = { matched, created }; st.step = 'pronto'; api.update();
    }
  }

  // ---- backup ----
  async function flowRestore(file, zip) {
    let data;
    try {
      if (zip) { const e = zip.entries.find((x) => x.base === 'dados.json'); data = JSON.parse(await (await C.zipEntryBlob(zip, e)).text()); }
      else data = JSON.parse(await file.text());
    } catch (e) { throw new Error('Não consegui ler este backup.'); }
    if (!data || data.app !== 'registro-cirurgias') throw new Error('Este arquivo não é um backup deste app.');
    const ok = await confirmDialog({ title: 'Restaurar backup?', text: `Backup de ${data.exportadoEm ? ddmmyyyy(data.exportadoEm.slice(0, 10)) : 'data desconhecida'} com ${plural((data.records || []).length, 'cirurgia', 'cirurgias')}. Os dados atuais deste aparelho serão substituídos.`, ok: 'Restaurar', danger: true });
    if (!ok) return;
    const b = busy('Restaurando…');
    try {
      const keepPin = { pinHash: S.settings.pinHash, pinSalt: S.settings.pinSalt };
      for (const s of STORES) await Store.clear(s);
      urlCache.forEach((u) => URL.revokeObjectURL(u)); urlCache.clear();
      await Store.putMany('records', data.records || []);
      await Store.putMany('terms', data.terms || []);
      await Store.putMany('repasses', data.repasses || []);
      await Store.putMany('loose', data.loose || []);
      await Store.putMany('ignored', (data.ignored || []).map((key) => ({ key })));
      await Store.put('meta', { ...DEFAULT_SETTINGS, ...(data.settings || {}), ...keepPin, k: 'settings' });
      if (zip) {
        const fotos = zip.entries.filter((e) => /^fotos\/[^/]+$/.test(e.name) && !/\.t\.[a-z]+$/i.test(e.name));
        let i = 0;
        for (const e of fotos) {
          const id = e.base.replace(/\.[a-z0-9]+$/i, '');
          const buf = await (await C.zipEntryBlob(zip, e)).arrayBuffer();
          const te = zip.entries.find((x) => x.name.startsWith('fotos/' + id + '.t.'));
          const tbuf = te ? await (await C.zipEntryBlob(zip, te)).arrayBuffer() : null;
          await Store.put('photos', { id, name: e.base, type: extType(e.base), buf, tbuf });
          b.set(++i / fotos.length, `Restaurando fotos ${i} de ${fotos.length}`);
        }
      }
      S.demo = false; await load(); persistStorage();
    } finally { b.done(); }
    go('inicio'); toast('Backup restaurado.');
  }
  const typeExt = (t) => ({ 'image/png': 'png', 'image/heic': 'heic', 'image/webp': 'webp', 'image/gif': 'gif' }[t] || 'jpg');
  async function exportBackup() {
    if (PREVIEW) { await confirmDialog({ title: 'Backup só no app instalado', text: 'Nesta prévia nada fica salvo e o navegador não deixa gravar arquivos. Depois de instalar, este botão gera um .zip com tudo para guardar em Arquivos.', ok: 'Entendi', cancel: false }); return; }
    const b = busy('Preparando o backup…');
    let blob;
    try {
      const data = { app: 'registro-cirurgias', versao: 1, exportadoEm: new Date().toISOString(), records: S.records, terms: S.terms, repasses: S.repasses, loose: S.loose, ignored: [...S.ignored], settings: { ...S.settings, lastBackup: today(), pinHash: null, pinSalt: null } };
      const files = [{ name: 'dados.json', data: JSON.stringify(data) }];
      const photos = await Store.all('photos');
      for (const p of photos) { files.push({ name: `fotos/${p.id}.${typeExt(p.type)}`, data: new Uint8Array(p.buf) }); if (p.tbuf) files.push({ name: `fotos/${p.id}.t.jpg`, data: new Uint8Array(p.tbuf) }); }
      blob = await C.zipWrite(files);
    } finally { b.done(); }
    const ok = await offerFile(blob, `cirurgias-backup-${today()}.zip`, 'application/zip', 'Backup pronto', `${plural(S.records.length, 'cirurgia', 'cirurgias')}, ${(blob.size / 1048576).toFixed(1).replace('.', ',')} MB. Salve em Arquivos (iCloud Drive ou Google Drive) para ter uma cópia fora do iPhone.`);
    if (ok) { S.settings.lastBackup = today(); await saveSettings(); render(); }
  }
  function csvCell(v) { const s = v == null ? '' : String(v); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  async function exportCSV() {
    if (PREVIEW) { await confirmDialog({ title: 'Disponível no app instalado', text: 'Nesta prévia o navegador não deixa gravar arquivos.', ok: 'Entendi', cancel: false }); return; }
    const head = ['Nº', 'Data', 'Hora', 'Urgência', 'Procedimentos', 'Hospital', 'Colegas', 'Função', 'Convênio', 'Situação', 'Valor recebido', 'Data do pagamento', 'Valor previsto ou estimado', 'Origem', 'Repasse', 'Fotos', 'Legenda'];
    const money = (v) => (v == null ? '' : nf2.format(v).replace(/\./g, ''));
    const rows = [...S.records].sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))).map((r) => {
      const v = valueOf(r); const rp = r.recebido || {};
      return [r.num || '', ddmmyyyy(r.date), r.time || '', urgOf(r) ? 'sim' : '', procText(r), r.hosp || '', (r.cols || []).join(', '), r.funcao || '', r.conv || '', { aberto: 'Em aberto', recebido: 'Recebido', semcobranca: 'Sem cobrança' }[r.status],
        r.status === 'recebido' ? money(rp.valor) : '', rp.data ? ddmmyyyy(rp.data) : '', isOpen(r) ? money(v.v) : '', r.origem, (S.repasses.find((x) => x.id === rp.repId) || {}).numero || '', (r.photoIds || []).length, (r.caption || '').replace(/\s+/g, ' ')];
    });
    const text = '﻿' + [head, ...rows].map((r) => r.map(csvCell).join(';')).join('\r\n');
    await offerFile(new Blob([text], { type: 'text/csv;charset=utf-8' }), `cirurgias-${today()}.csv`, 'text/csv', 'Planilha pronta', `${plural(rows.length, 'cirurgia', 'cirurgias')}. Abre no Excel, no Numbers e no Google Planilhas.`);
  }
  function offerFile(blob, name, type, title, text) {
    return new Promise((res) => {
      let done = false;
      const api = openSheet({ title, onClose: () => { if (!done) res(false); }, render() {
        return { body: [h('div', { class: 'empty' }, icon('file'), h('b', { style: 'color:var(--ink)' }, name), h('p', null, text))],
          foot: h('button', { class: 'btn primary', type: 'button', onclick: async () => {
            let file = new File([blob], name, { type });
            try {
              if (navigator.canShare && !navigator.canShare({ files: [file] })) { const alt = new File([blob], name, { type: 'application/octet-stream' }); if (navigator.canShare({ files: [alt] })) file = alt; }
              if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: name });
              else { const u = URL.createObjectURL(blob); const a = h('a', { href: u, download: name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 4000); }
              done = true; res(true); api.close(true); toast('Arquivo pronto. Confira se salvou em Arquivos.');
            } catch (e) { if (e && e.name !== 'AbortError') toast('Não deu para salvar: ' + e.message); }
          } }, icon('share'), 'Salvar ou compartilhar') };
      } });
    });
  }

  // ================= instalação =================
  function sheetInstall() {
    openSheet({ title: 'Instalar no iPhone', render() {
      const body = [];
      if (PREVIEW) {
        body.push(h('p', null, 'Esta prévia serve para ver o app funcionando. Para usar no dia a dia, com os dados guardados no iPhone e funcionando sem internet, ele precisa ser publicado uma vez num endereço seu. O código fica público; os dados nunca saem do aparelho.'));
        body.push(h('div', { class: 'section' }, h('div', { class: 'section-title' }, 'Uma vez só: publicar (cerca de 10 minutos)'), h('ol', { class: 'steps' },
          h('li', null, h('span', null, 'Salve em Arquivos o pacote ', h('code', null, 'registro-cirurgias.zip'), ' que está na conversa com o Claude e toque nele para abrir a pasta.')),
          h('li', null, h('span', null, 'Crie uma conta gratuita em ', h('b', null, 'github.com'), '. É mais rápido num computador, mas dá para fazer no Safari.')),
          h('li', null, h('span', null, 'Crie um repositório público chamado ', h('code', null, 'cirurgias'), ' (botão "New").')),

      }
      body.push(h('div', { class: 'section' }, h('div', { class: 'section-title' }, PREVIEW ? 'Depois, no iPhone' : 'No iPhone'), h('ol', { class: 'steps' },
        h('li', null, h('span', null, 'Abra o endereço do app no ', h('b', null, 'Safari'), '.')),
        h('li', null, h('span', null, 'Toque em ', h('b', null, 'Compartilhar'), ' e depois em ', h('b', null, 'Adicionar à Tela de Início'), '.')),
        h('li', null, h('span', null, 'Abra pelo ícone novo e importe a conversa do WhatsApp e os repasses.')),

      if (!PREVIEW && !isStandalone()) body.push(h('button', { class: 'btn ghost', type: 'button', onclick: async () => { S.settings.installHidden = true; await saveSettings(); render(); toast('Aviso escondido.'); } }, 'Não mostrar mais o aviso'));
      return { body };
    } });
  }

  // ================= PIN =================
  async function hashPin(pin, salt) {
    const data = new TextEncoder().encode(salt + ':' + pin);
    if (window.crypto && crypto.subtle) { const d = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(d)].map((x) => x.toString(16).padStart(2, '0')).join(''); }
    let hsh = 0; for (const x of data) hsh = (hsh * 31 + x) | 0; return 'w' + (hsh >>> 0).toString(16);
  }
  function sheetPin() {
    const st = { a: '', b: '', cur: '' };
    openSheet({ title: 'PIN para abrir o app', back: true, render(api) {
      const pinIn = (k, label) => field(label, h('input', { type: 'password', inputmode: 'numeric', pattern: '[0-9]*', maxlength: 6, autocomplete: 'off', value: st[k], oninput: (e) => { st[k] = e.target.value.replace(/\D/g, ''); } }));
      const body = [h('p', { class: 'muted' }, 'O PIN impede que alguém abra o app pelo ícone. Os dados não ficam criptografados; a proteção principal continua sendo o bloqueio do iPhone.')];
      if (S.settings.pinHash) {
        body.push(h('form', { class: 'form', onsubmit: (e) => e.preventDefault() }, pinIn('cur', 'PIN atual')));
        return { body, foot: h('button', { class: 'btn danger', type: 'button', onclick: async () => {
          if ((await hashPin(st.cur, S.settings.pinSalt)) !== S.settings.pinHash) { toast('PIN incorreto.'); return; }
          S.settings.pinHash = null; S.settings.pinSalt = null; await saveSettings(); render(); api.close(true); toast('PIN removido.');
        } }, 'Remover PIN') };
      }
      body.push(h('form', { class: 'form', onsubmit: (e) => e.preventDefault() }, pinIn('a', 'Novo PIN (4 a 6 números)'), pinIn('b', 'Repita o PIN')));
      return { body, foot: h('button', { class: 'btn primary', type: 'button', onclick: async () => {
        if (st.a.length < 4) { toast('Use de 4 a 6 números.'); return; }
        if (st.a !== st.b) { toast('Os dois PINs não são iguais.'); return; }
        S.settings.pinSalt = C.uid('s'); S.settings.pinHash = await hashPin(st.a, S.settings.pinSalt); await saveSettings(); render(); api.close(true); toast('PIN ativado.');
      } }, 'Ativar PIN') };
    } });
  }
  let locked = false;
  function lockScreen() {
    if (locked || !S.settings.pinHash) return Promise.resolve();
    locked = true;
    return new Promise((res) => {
      const err = h('p', { class: 'err', role: 'alert' });
      const inp = h('input', { type: 'password', inputmode: 'numeric', pattern: '[0-9]*', maxlength: 6, autocomplete: 'off', 'aria-label': 'PIN' });
      const tryPin = async () => { if ((await hashPin(inp.value, S.settings.pinSalt)) === S.settings.pinHash) { wrap.remove(); locked = false; res(); } else { err.textContent = 'PIN incorreto.'; inp.value = ''; inp.focus(); } };
      const wrap = h('div', { class: 'lock' }, icon('lock'), h('h2', null, 'Registro de Cirurgias'), h('form', { class: 'form', style: 'align-items:center', onsubmit: (e) => { e.preventDefault(); tryPin(); } }, inp, err, h('button', { class: 'btn primary', type: 'submit' }, 'Entrar')));
      document.body.append(wrap); setTimeout(() => inp.focus(), 50);
    });
  }
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (S.settings.pinHash && hiddenAt && Date.now() - hiddenAt > 60000) lockScreen();
  });

  // ================= dados de exemplo (prévia) =================

      { id: 'tdemo2', type: 'col', name: 'Dra. Prado (exemplo)', aliases: ['prado'], demo: true },
      { id: 'tdemo3', type: 'hosp', name: 'Hospital Central (exemplo)', aliases: ['central'], demo: true },

      mk(101, '16:20', [cvl], HV, P, null), mk(95, '22:10', [apvl], HV, A, null),
      mk(64, '08:30', [cvl], HC, A, null), mk(51, '19:45', [apvl], HC, P, null), mk(38, '11:20', [cvl, 'Drenagem de abscesso'], HC, A, null),
      mk(23, '15:00', [hern], HV, P, null), mk(12, '20:40', [apvl], HC, A, null), mk(6, '13:15', [cvl], HV, P, null),
      newRecord({ num: ++num, origem: 'whatsapp', date: day(3), time: '17:50', procs: [], hosp: HC, cols: [A], caption: '(exemplo sem procedimento)', revisar: ['Sem procedimento'], demo: true })];
    S.terms.push(...terms); S.records.push(...recs);
    S.repasses.push({ id: 'repdemo', numero: '000123', comp: 'exemplo', nome: 'Repasse de exemplo', total: 1842.39, n: 5, hosp: HC, pay: day(70), importedAt: Date.now(), demo: true });
    S.settings.seq = num; S.demo = true; derive();
  }

  // ================= início =================
  async function init() {
    try { await load(); } catch (e) {
      $('#main').replaceChildren(h('div', { class: 'empty' }, icon('alert'), h('p', null, 'Não consegui abrir os dados deste aparelho: ' + (e && e.message))));
      return;
    }
    if (PREVIEW && !S.records.length) loadDemo();
    $('#tabbar').replaceChildren(h('div', { class: 'tabbar-in' }, [['inicio', 'home', 'Início'], ['lista', 'list', 'Cirurgias'], ['relatorios', 'chart', 'Relatórios'], ['ajustes', 'gear', 'Ajustes']]
      .map(([t, ic, l]) => h('button', { class: 'tab', type: 'button', 'data-tab': t, onclick: () => go(t) }, icon(ic), l))));
    render();
    if (S.settings.pinHash) await lockScreen();
    if (!PREVIEW && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  window.__app = { S, go, render, routeFile, Store };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
